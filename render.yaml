services:
  - type: web
    name: chamxanh-api
    runtime: docker
    region: singapore
    plan: standard            # không dùng free: free ngủ sau 15 phút, làm chết job nền và SignalR (tài liệu 06 §1)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__Mongo
        sync: false           # connection string MongoDB Atlas (replica set, cần cho transaction)
      - key: Mongo__Database
        value: chamxanh
      - key: Auth__JwtKey
        generateValue: true
      - key: Auth__BffSecret
        sync: false           # trùng với BFF_SECRET trên Vercel — để giới hạn đăng ký theo IP người dùng thật
      - key: Security__DataKey
        sync: false           # base64 của 32 byte ngẫu nhiên — mất khóa là mất dữ liệu CCCD đã mã hóa, phải sao lưu an toàn
      - key: Security__HmacKey
        sync: false           # base64, không đổi sau khi đã có dữ liệu
      - key: Payments__WebhookSecret
        sync: false
      - key: Admin__BootstrapUsername
        sync: false
      - key: Admin__BootstrapPassword
        sync: false           # chỉ dùng cho lần khởi động đầu tiên; bật 2FA ngay sau đó
      - key: Listings__LaunchDate
        sync: false           # ngày ra mắt (ISO 8601): tin đăng hộ trước ngày này tính hạn từ ngày ra mắt
      - key: Cors__Origins__0
        value: https://chamxanh.vn
      - key: Cors__Origins__1
        value: https://admin.chamxanh.vn
      - key: Cors__Origins__2
        value: https://cx-fe-web.vercel.app   # tên miền web hiện tại; PayOS được phép đưa người dùng về đây
      # Gói Xanh Plus/Pro thanh toán qua PayOS: lấy 3 khóa trong kênh thanh toán PayOS (my.payos.vn).
      # Đặt webhook của kênh là https://<api>/api/payments/payos/webhook
      - key: PayOS__ClientId
        sync: false
      - key: PayOS__ApiKey
        sync: false
      - key: PayOS__ChecksumKey
        sync: false
      - key: PayOS__ReturnBaseUrl
        value: https://cx-fe-web.vercel.app  # web mà PayOS đưa người dùng quay về sau khi trả tiền (tên miền đang chạy)
      # Trợ lý AI: khóa Google AI Studio (aistudio.google.com → Get API key).
      - key: Gemini__ApiKey
        sync: false
      - key: Gemini__Model
        value: gemini-3.5-flash
      # Email nhắc lịch chăm cây qua SMTP. Gmail: smtp.gmail.com, Username = địa chỉ Gmail,
      # Password = "mật khẩu ứng dụng" 16 ký tự (Google Account → Bảo mật → Mật khẩu ứng dụng), không dùng mật khẩu Gmail.
      - key: Email__SmtpHost
        value: smtp.gmail.com
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__From
        sync: false
      - key: Email__WebBaseUrl
        value: https://cx-fe-web.vercel.app
